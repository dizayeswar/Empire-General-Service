<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest?v=2026-09-15-sec-acc">
<meta name="theme-color" content="#8d015d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A.S.A.A.S">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="logo-light.png" type="image/png">
<title>A.S.A.A.S — Empire World</title>
<style id="empire-auth-boot">body.auth-login-visible #asaasOfficeApp{display:none!important}</style>
<link rel="stylesheet" href="assets/empire.css?v=2026-09-22-search-pill">
<link rel="stylesheet" href="assets/asaas-leave.css?v=2026-10-20-saved-requests">
</head>
<body class="auth-login-visible">
<div class="login-page show" id="loginPage">
  <div class="login-box">
    <button class="theme-btn login-theme" onclick="toggleTheme()" aria-label="Toggle dark or light mode"><span class="nav-icon theme-icon"></span></button>
    <img src="logo-light.png" alt="Empire World" style="height:44px;width:auto;display:block;margin:0 auto 16px;">
    <a class="back" href="index.html">← Back to hub</a>
    <h1>🛡️ A.S.A.A.S</h1>
    <div class="login-message" id="loginMessage"></div>
    <form class="login-form" onsubmit="asaasHandleLogin_(event)">
      <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username">
      <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
      <button type="submit">Login</button>
    </form>
  </div>
</div>

<div id="asaasOfficeApp" class="container">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <img src="logo-light.png" alt="Empire World" class="sidebar-logo">
        <button class="side-toggle" onclick="toggleSidebar()" id="sideToggleBtn" aria-label="Collapse sidebar">☰</button>
      </div>
      <div class="side-title">
        <h1>🛡️ A.S.A.A.S</h1>
      </div>
      <p id="asaasWhoLabel"></p>
      <nav class="side-nav">
        <button class="tab-btn active" id="asaasLeaveTab-form" onclick="asaasLeaveShowTab_('form')"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h8"/></svg></span> <span class="lbl">Leave Request</span></button>
        <button class="tab-btn" id="asaasLeaveTab-saved" onclick="asaasLeaveShowTab_('saved')"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></span> <span class="lbl">Saved Requests</span></button>
      </nav>
      <div class="side-actions">
        <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle dark or light mode"><span class="nav-icon theme-icon"></span> <span class="lbl">Theme</span></button>
        <button onclick="location.href='index.html'"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg></span> <span class="lbl">Hub</span></button>
        <button onclick="asaasLogout_()" style="color:#fff;background:#C5504F;border-color:#C5504F;"><span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></span> <span class="lbl">Logout</span></button>
      </div>
    </aside>
    <div class="main-area">
      <div class="tab-content active" id="asaasLeavePane-form">
        <div class="form-section">
          <h2>Leave Request</h2>
          <div class="alv-toolbar">
            <button onclick="asaasLeavePrint_()">Print / Save PDF</button>
            <button onclick="asaasLeaveClear_()">Clear form</button>
            <button onclick="asaasLeaveSave_()">Save</button>
          </div>
          <p class="alv-status" id="asaasLeaveStatus" aria-live="polite"></p>
          <div class="alv-stage" id="asaasLeaveStage">
            <div class="alv-scale" id="asaasLeaveScale"><div class="alv-sheet" id="asaasLeaveSheet"></div></div>
          </div>
        </div>
      </div>
      <div class="tab-content" id="asaasLeavePane-saved">
        <div class="form-section">
          <h2>Saved Requests</h2>
          <div class="form-row">
            <div class="form-group">
              <label for="asaasLeaveSearch">Search</label>
              <input type="search" id="asaasLeaveSearch" oninput="asaasLeaveRenderSaved_()" placeholder="Name, type of leave, date…" autocomplete="off">
            </div>
            <div class="form-group"><label>&nbsp;</label><button onclick="asaasLeaveReloadSaved_()">Refresh</button></div>
          </div>
          <div id="asaasLeaveSavedList"></div>
        </div>
      </div>
      <footer>Prepared by <strong>Swar Dizayee</strong></footer>
    </div>
  </div>
</div>

<script src="assets/empire-sw-update.js?v=2026-09-15-sec-acc"></script>
<script src="config.js?v=2026-09-15-sec-acc"></script>
<script src="assets/empire-api.js?v=2026-09-15-sec-acc"></script>
<script src="assets/empire-auth.js?v=2026-09-19-user-autofill"></script>
<script src="assets/empire-core.js?v=2026-09-15-sec-acc"></script>
<script src="assets/asaas-leave.js?v=2026-10-20-saved-requests"></script>
<script>
var ASAAS_DEPT = 'asaas';

function asaasEnter_() {
  document.getElementById('loginPage').classList.remove('show');
  if (typeof empireAuthMarkLoginVisible === 'function') empireAuthMarkLoginVisible(false);
  document.getElementById('asaasOfficeApp').classList.add('show');
  var wl = document.getElementById('asaasWhoLabel');
  if (wl) wl.textContent = 'Logged in as: ' + (empireGetUser() || '') + (empireGetRole() ? (' (' + empireGetRole() + ')') : '');
  asaasLeaveFit_();
}
function asaasHandleLogin_(e) {
  empireAuthLogin(e, ASAAS_DEPT, { onSuccess: asaasEnter_ });
}
function asaasLogout_() {
  empireAuthWorkerLogout({ redirect: 'index.html', reload: false });
}
function asaasBoot_() {
  if (!empireGetToken()) {
    document.getElementById('loginPage').classList.add('show');
    if (typeof empireAuthMarkLoginVisible === 'function') empireAuthMarkLoginVisible(true);
    return;
  }
  if (!empireCanAccessDept(ASAAS_DEPT)) {
    location.replace('index.html');
    return;
  }
  asaasEnter_();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', asaasBoot_);
else asaasBoot_();
</script>
</body>
</html>
